<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}My App{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <body>
        <!--Bootstrap script-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        
        <!--Nav bar-->
        <nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark border-bottom border-body">
            <div class="container-fluid">
              <a class="navbar-brand" href="#">Navbar</a>

              <!-- If it is narrow-->
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>

              <!-- Actual nav items-->
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                    <ul class="navbar-nav">
                        <!-- Home page-->
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="{{ url_for('landing.home') }}">Home</a>
                        </li>
                        <!-- Pipeline page-->
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('pipelines.pipelines_list') }}">Pipelines</a>
                        </li>
                        <!-- Run page-->
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('runs.runs_list') }}">Runs</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('auth.logout') }}">Logout</a>
                        </li>
                        <!-- <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Dropdown link
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Action</a></li>
                                <li><a class="dropdown-item" href="#">Another action</a></li>
                                <li><a class="dropdown-item" href="#">Something else here</a></li>
                            </ul>
                        </li> -->
                    </ul>
                </div>
            </div>
        </nav>

        <!--Flash below nav bar-->
        <div class="flashes">
            {% for category, message in get_flashed_messages(with_categories=true) %}
                <div class="alert alert-{{category | safe }} alert-dismissible fade show" role="alert">
                    <div>{{message}}</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>

        {% block content %}
        <!-- Dynamic content will be injected here -->
        {% endblock %}
        </div>
    </body>
</html>
